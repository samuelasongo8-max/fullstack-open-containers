services:
  frontend:
    build:
      context: ../../phonebook-exercise21/phonebook-app/frontend
      dockerfile: ../../../fs-containers/my-app/frontend/Dockerfile
    container_name: phonebook-frontend-prod
    restart: unless-stopped

  backend:
    build:
      context: ../../phonebook-exercise21/phonebook-app/backend
      dockerfile: ../../../fs-containers/my-app/backend/Dockerfile
    container_name: phonebook-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: phonebook-nginx-prod
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
